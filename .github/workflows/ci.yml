name: CI

# Runs on every push and pull request. All three jobs must pass before a
# change is merged (SRS NFR-MNT-2). The end-to-end job is the automated test
# suite for the SRS functional requirements: each test name starts with the
# FR it checks — see docs/testing/README.md.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile app — typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  backend:
    name: Backend — lint, typecheck, unit tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck (source and tests)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: No known high or critical vulnerabilities in production packages
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end tests (SRS functional requirements)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      TEST_DB: cx_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cx_test
      # Test-only secret: signs the tests' sessions. Not a real key.
      TEST_JWT_SECRET: campusxchange-test-only-secret-0123456789abcdef
      POSTGREST_URL: http://127.0.0.1:3001
    defaults:
      run:
        working-directory: code/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/backend/package-lock.json
      - run: npm ci --no-audit --no-fund

      - name: psql client
        run: which psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Test database (Supabase stand-in + every migration)
        run: bash ./test/stack/setup-db.sh

      - name: Start PostgREST
        run: |
          curl -fsSL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          PGRST_DB_URI="postgres://authenticator:authenticator@localhost:5432/$TEST_DB" \
          PGRST_DB_SCHEMAS=public \
          PGRST_DB_ANON_ROLE=anon \
          PGRST_JWT_SECRET="$TEST_JWT_SECRET" \
          PGRST_SERVER_PORT=3001 \
            nohup "$RUNNER_TEMP/postgrest" > "$RUNNER_TEMP/postgrest.log" 2>&1 &
          for i in $(seq 1 30); do curl -fs "$POSTGREST_URL" > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/postgrest.log"; exit 1

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Backend logs (on failure)
        if: failure()
        run: |
          cat /tmp/cx-e2e/backend-*.log || true
          cat "$RUNNER_TEMP/postgrest.log" || true

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: code/backend/test-results/
          if-no-files-found: ignore
