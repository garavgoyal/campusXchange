name: CI

on:
  push:
  pull_request:

jobs:
  mobile:
    name: Mobile (Expo) — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit

  backend:
    name: Backend (NestJS) — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run build
